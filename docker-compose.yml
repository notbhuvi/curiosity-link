services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: curiosity_link
      POSTGRES_USER: curiosity
      POSTGRES_PASSWORD: curiosity
    ports:
      - "5432:5432"
    volumes:
      - curiosity_postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  curiosity_postgres:
