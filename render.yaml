services:
  - type: web
    name: curiosity-link
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: curiosity-link-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false

databases:
  - name: curiosity-link-db
    plan: free
